<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сысоев Степан</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #080808;
    color: white;
    min-height: 100vh;
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background:
        radial-gradient(circle at 50% 20%, #333 0%, #111 35%, #080808 70%);
}

.card {
    width: 100%;
    max-width: 900px;
    padding: 50px 30px;
    text-align: center;
    border: 1px solid #333;
    border-radius: 30px;
    background: rgba(20,20,20,.8);
    box-shadow: 0 0 60px rgba(255,255,255,.08);
}

h1 {
    font-size: clamp(42px, 9vw, 90px);
    margin: 0 0 15px;
    letter-spacing: -3px;
}

.subtitle {
    color: #aaa;
    font-size: 20px;
    margin-bottom: 35px;
}

.photo {
    width: 260px;
    height: 260px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid white;
    box-shadow: 0 0 40px rgba(255,255,255,.2);
    margin-bottom: 30px;
}

.info {
    font-size: 18px;
    color: #ccc;
    line-height: 1.7;
}

.button {
    display: inline-block;
    margin-top: 30px;
    padding: 15px 30px;
    border-radius: 50px;
    background: white;
    color: black;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
}

.button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px white;
}

footer {
    margin-top: 40px;
    color: #666;
    font-size: 14px;
}
</style>
</head>

<body>

<section class="hero">
    <div class="card">

        <img
            class="photo"
            src="https://via.placeholder.com/500"
            alt="Сысоев Степан">

        <h1>Сысоев Степан</h1>

        <div class="subtitle">
            Личная страница
        </div>

        <div class="info">
            Добро пожаловать на мою персональную страницу.
        </div>

        <a class="button" href="#about">
            Подробнее
        </a>

        <footer>
            © 2026 Сысоев Степан
        </footer>

    </div>
</section>

</body
